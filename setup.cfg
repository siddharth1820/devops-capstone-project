
[nosetests]
verbosity=2
with-spec=1
with-coverage=1
cover-erase=1
cover-package=service
cover-xml=1
cover-xml-file=coverage.xml

[coverage:run]
branch=True
source=service

[coverage:report]
show_missing=True
fail_under=0

[flake8]
max-line-length=127
exclude=.git,__pycache__,venv,build,dist
statistics=True

[pylint]
max-line-length=127
disable=C0114,C0115,C0116
